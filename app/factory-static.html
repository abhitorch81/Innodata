<style>
:root{--bg:#05060d;--fg:#e8ecf8;--mut:#8a93b2;--line:rgba(255,255,255,.09);--glass:rgba(14,17,34,.62);

*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);

#top{position:fixed;top:14px;left:16px;right:16px;display:flex;align-items:center;gap:18px;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;gap:10px;align-items:center}.brand b{display:block;letter-spacing:.04em}.brand small{color:var(--mut);font-size:11px}
.logo{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,#4cc9f0,#b388ff,#ffb703,#4cc9f0);
box-shadow:0 0 22px rgba(76,201,240,.55);animation:spin 9s linear infinite}@keyframes spin{to{filter:hue-rotate(360deg)}}
#nav{display:flex;gap:4px;margin:0 auto;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px)}
#nav button{background:none;border:0;color:var(--mut);padding:7px 16px;border-radius:999px;cursor:pointer;font:inherit;transition:.25s}
#nav button.on{background:linear-gradient(135deg,rgba(76,201,240,.28),rgba(179,136,255,.28));color:#fff;box-shadow:0 0 18px rgba(76,201,240,.25)}
#nav button:hover{color:#fff}kbd{font:10px ui-monospace,monospace;opacity:.5;margin-left:4px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.pill{padding:6px 12px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--glass);color:var(--mut)}
.pill.live{color:var(--ok);border-color:rgba(6,214,160,.4)}.pill.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
background:var(--ok);margin-right:7px;box-shadow:0 0 10px var(--ok);animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.35}}
.pill.static{color:var(--warn);border-color:rgba(255,209,102,.35)}
#left{position:fixed;left:16px;top:70px;bottom:92px;width:252px;padding:14px;overflow:auto;z-index:4}
#left h3,#right h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);font-weight:600}
.fam{margin:10px 0 4px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 9px currentColor;background:currentColor}
.trow{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:.2s;font-size:13px}
.trow:hover{background:rgba(255,255,255,.06)}.trow.on{background:rgba(76,201,240,.13);border-color:rgba(76,201,240,.4)}
.trow small{margin-left:auto;color:var(--mut);font-size:11px}.trow.live small{color:var(--ok)}
#right{position:fixed;right:16px;top:70px;bottom:92px;width:372px;z-index:4;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:12px 4px;cursor:pointer;font:inherit;
border-bottom:2px solid transparent;transition:.2s}.tabs button.on{color:#fff;border-color:var(--acc)}
.pane{display:none;padding:14px 16px;overflow:auto;flex:1}.pane.on{display:block}
h2.t{margin:0 0 4px;font-size:18px;line-height:1.25}.sub{color:var(--mut);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.btn{background:linear-gradient(135deg,#4cc9f0,#7b6cf6);border:0;color:#04121c;font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;

.btn.ghost{background:rgba(255,255,255,.06);color:var(--fg);box-shadow:none;border:1px solid var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
ol.stages{list-style:none;margin:12px 0;padding:0}ol.stages li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);opacity:.55;transition:.4s;font-size:13px}
ol.stages li b{width:26px;color:var(--mut);font-weight:600}ol.stages li span{flex:1}ol.stages li i{font-style:normal;font-size:12px}
ol.stages li.ok{opacity:1}ol.stages li.ok i{color:var(--ok)}ol.stages li.warn{opacity:1}ol.stages li.warn i{color:var(--warn)}
ol.stages li.bad{opacity:1}ol.stages li.bad i{color:var(--bad)}ol.stages li.na{opacity:.8}ol.stages li.na i{color:var(--mut)}

.rule{padding:8px 10px;border-radius:10px;border:1px solid var(--line);margin:6px 0;cursor:pointer;transition:.25s;background:rgba(255,255,255,.03)}

.res{margin-top:12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.verdict{font-size:20px;font-weight:800;letter-spacing:.04em}.verdict.RESOLVED{color:var(--ok)}.verdict.UNRESOLVED{color:var(--bad)}.verdict.REJECTED{color:var(--warn)}
.bar{height:7px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin:3px 0 9px}.bar>div{height:100%;width:0;border-radius:5px;background:var(--ok)}
.bar.partial>div{background:linear-gradient(90deg,var(--bad),var(--warn))}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}.kv b{color:var(--fg)}
.check{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px}.check input{margin-top:3px;accent-color:#4cc9f0}.check small{color:var(--mut);display:block}
.ix{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:11px;margin:7px 0;cursor:pointer;transition:.2s;background:rgba(255,255,255,.03)}
.ix:hover{border-color:var(--acc);transform:translateX(3px)}.ix span{font-size:20px}.ix small{color:var(--mut);display:block;font-size:11px}

#banner{position:fixed;left:50%;bottom:112px;transform:translateX(-50%) translateY(20px);opacity:0;padding:10px 18px;border-radius:999px;z-index:6;

#hover{position:fixed;z-index:8;padding:9px 12px;font-size:12px;pointer-events:none;opacity:0;transform:translate(14px,14px);max-width:260px}
#console{position:fixed;left:16px;right:16px;bottom:14px;height:64px;z-index:4;padding:8px 14px;overflow:hidden}
#log{font:11px/1.5 ui-monospace,Menlo,monospace;color:#9fb0d8;height:100%;overflow:auto;white-space:pre-wrap}

.lbl.gate{color:#fff}.lbl.core{background:rgba(255,209,102,.18);border-color:rgba(255,209,102,.5)}

@media(max-width:760px){#right{top:auto;height:44vh;left:10px;right:10px;width:auto;bottom:84px}#nav button{padding:6px 10px}.brand small{display:none}}

-> `Most, ///< Recover odd behavior of previous versions (implem`"]},"S7_determinism":{"ok":true}},"problem_md":"# Add the `arrayInlineLimit` StreamWriterBuilder setting\n\nIn pretty mode `StreamWriterBuilder` writes every array one element per line, which makes lists of small numbers very tall. Add an opt-in setting that prints short arrays on one line. Examples use indentation of two spaces. The implementation belongs in `src/lib_json/json_writer.cpp` (document the setting in `include/json/writer.h`).\n\n## Requirements\n\n1. **The `arrayInlineLimit` setting.** Add a `StreamWriterBuilder` setting `\"arrayInlineLimit\"` (an unsigned integer). `setDefaults` must set it to `0` (so `settings_[\"arrayInlineLimit\"]` is `0` on a fresh builder) and `validate()` must accept the key as a known setting. With value `0`, or when `\"indentation\"` is the empty string, the output is byte-for-byte what the writer produced before this change. Otherwise, with limit N > 0, a non-empty array that has at most N elements, every element being a simple value (null, bool, number or string), is written on a single line as `[ 1, 2 ]` (a space after `[` and before `]`), elements separated by `, ` and each formatted exactly as it would be otherwise. This holds for both `commentStyle` values. A single-line array follows its member name and colon directly (`\"key\" : [1, 2]`), appears on its own indented line when it is an element of a multi-line array, and starts the output when it is the root. Every array that is not written on a single line by these requirements is written exactly as before. When `commentStyle` is `\"None\"`, only arrays that qualify for a single line are tested.\n2. **Empty containers count as simple.** An empty array (`[]`) or empty object (`{}`) element also counts as a simple value for the purpose of the single-line condition, and is written `[]` / `{}` inside the line. Non-empty objects never count.\n3. **Nested single-line arrays.** A non-empty array element counts as a simple value if that array itself qualifies for a single line under these requirements (including the element-count limit); it is then written inline inside the outer line, in the same form. Arrays that do not qualify disqualify their parent.\n4. **Limit counts leaves.** The limit N bounds the total number of simple values (empty containers included, when they count) found in the array at any depth, instead of only its direct elements. Every array, nested ones included, is judged by the leaves it contains.\n5. **Root array is exempt.** An array that is the root value of the document is never written on a single line; it is written exactly as before. Arrays below the root are unaffected.\n6. **Comments keep arrays expanded.** When `commentStyle` is `\"All\"`, an array with an element that has a comment attached to it (placement does not matter) is not written on a single line, so that the comment is preserved; it is written as before. A comment on the array itself does not matter. With `commentStyle` `\"None\"` comments are not written and have no effect.\n7. **Strict setting validation.** `newStreamWriter()` throws a `std::exception` unless `\"arrayInlineLimit\"` is an integer value (`Json::intValue` or `Json::uintValue`) that is not negative. Reals (even whole ones), bools and strings are rejected. A setting that is missing behaves as `0`.\n\n## Notes\n\n- Do not modify existing tests. Hidden tests cover every numbered requirement above and the repository's existing test-suite must keep passing.\n- Anything not stated above is unspecified and is not tested.\n","demo":{"reference solution":{"fail_to_pass":"30/30","pass_to_pass":"137/137","per_rule":{"commentguard":"3/3","core":"7/7","emptyelem":"4/4","nestedarr":"4/4","noroot":"3/3","strictvalue":"5/5","totalcount":"4/4"},"build_ok":true,"verdict":"RESOLVED"},"plausible solution missing requirement 'emptyelem'":{"fail_to_pass":"26/30","pass_to_pass":"137/137","per_rule":{"commentguard":"3/3","core":"7/7","emptyel  [1, 2]`), appears on its own indented line when it is an element of a multi-line array, and starts the output when it is the root. Every array that is not written on a single line by these requirements is written exactly as before. When `commentStyle` is `\"None\"`, only arrays that qualify for a single line are tested.\n2. **Empty containers count as simple.** An empty array (`[]`) or empty object (`{}`) element also counts as a simple value for the purpose of the single-line condition, and is written `[]` / `{}` inside the line. Non-empty objects never count.\n3. **Nested single-line arrays.** A non-empty array element counts as a simple value if that array itself qualifies for a single line under these requirements (including the element-count limit); it is then written inline inside the outer line, in the same form. Arrays that do not qualify disqualify their parent.\n4. **Limit counts leaves.** The limit N bounds the total number of simple values (empty containers included, when they count) found in the array at any depth, instead of only its direct elements. Every array, nested ones included, is judged by the leaves it contains.\n5. **Width cap.** An array is written on a single line only if its single-line text, from `[` through `]`, is at most 28 characters long (strings count as written, quotes included). Otherwise it is written as before.\n6. **Comments keep arrays expanded.** When `commentStyle` is `\"All\"`, an array with an element that has a comment attached to it (placement does not matter) is not written on a single line, so that the comment is preserved; it is written as before. A comment on the array itself does not matter. With `commentStyle` `\"None\"` comments are not written and have no effect.\n7. **Strict setting validation.** `newStreamWriter()` throws a `std::exception` unless `\"arrayInlineLimit\"` is an integer value (`Json::intValue` or `Json::uintValue`) that is not negative. Reals (even whole ones), bools and strings are rejected. A setting that is missing behaves as `0`.\n\n## Notes\n\n- Do not modify existing tests. Hidden tests cover every numbered requirement above and the repository's existing test-suite must keep passing.\n- Anything not stated above is unspecified and is not tested.\n","demo":null,"dir":"/Users/abhi81/kiroween/task-factory/tasks/jsoncpp/arrayinline-04"},{"id":"jsoncpp/merge-01","repo":"jsoncpp","family":"merge","title":"Add `Json::Value::merge` (deep merge of JSON documents)","difficulty":"hard","base_commit":"93acc7b155048f1a66c43235cc205519f1e7a6ea","language":"cpp","f2p":59,"p2p":133,"rules":[{"id":"core","title":"Basic merge","requirement":"Add a public member function `Value& merge(const Value& patch, bool overwrite = true)` to `Json::Value` (declared in `include/json/value.h`, defined in `src/lib_json/json_value.cpp`). It merges `patch` into the receiver (`*this`), never modifies `patch`, copies (does not alias) whatever it takes from `patch`, and returns a reference to the receiver. If both the receiver and `patch` are objects, then for every member of `patch` the receiver ends up with a member of that name holding a copy of the patch's value (it is added when absent and replaced when present); receiver members that `patch` does not mention are untouched. If either of the two is not an object (null, bool, number, string or array), the receiver becomes a copy of `patch`. The `overwrite` argument only has an effect where a later requirement says so."},{"id":"noover","title":"Fill-only mode","requirement":"Call `merge(patch, false)` with `overwrite == false` is a fill-only merge: if both values are objects, only members of `patch` whose name is absent from the receiver are added (as described for the basic merge); every member the receiver already has is left exactly as it is - not replaced, not removed, not merged into - and no recursion into nested objects takes place. If either value is not an object the receiver is left unchanged. With `overwrite == true` this requirement changes nothing."},{"id":"keepmismatch","title":"Keep on kind mismatch","requirement":"Classify values into three kinds: object, array, and scalar (null, bool, any number, string). When the receiver and the patch both have a member of the same name and those two member values are of different kinds, the receiver's value is kept unchanged. Values of the same kind are handled by the other requirements. This applies to members only, never to the receiver and patch as a whole."},{"id":"deep","title":"Deep merge","requirement":"When the receiver and the patch both have a member of the same name and both member values are objects, those two objects are merged member by member, recursively, by the same rules, instead of the patch's object replacing the receiver's."},{"id":"depthlimit","title":"Depth limit","requirement":"Recursive object merging stops at depth 3. Count depth as follows: members of the top-level objects are at depth 1, members of their members at depth 2, and so on. Two object-valued members at depth d are merged recursively only if d < 3; otherwise the patch's object replaces the receiver's (as in the basic merge)."},{"id":"arrconcat","title":"Concatenate arrays","requirement":"If both values are arrays - the receiver and the patch as a whole, or two members of the same name - the receiver's array becomes its own elements followed by all elements of the patch's array, in order. Elements are copied as they are, never merged with each other."},{"id":"arrunion","title":"Skip duplicate elements","requirement":"When concatenating arrays, an element of the patch array is appended only if no element currently in the receiver's array (including elements appended earlier in the same concatenation) is equal to it, where equal means `Json::Value::operator==`. The receiver's own elements are never removed or reordered, even when duplicated."}],"tests_by_rule":{"arrconcat":7,"arrunion":9,"core":16,"deep":5,"depthlimit":4,"keepmismatch":8,"noover":10},"ref_line bool overwrite = true)` to `Json::Value` (declared in `include/json/value.h`, defined in `src/lib_json/json_value.cpp`). It merges `patch` into the receiver (`*this`), never modifies `patch`, copies (does not alias) whatever it takes from `patch`, and returns a reference to the receiver. If both the receiver and `patch` are objects, then for every member of `patch` the receiver ends up with a member of that name holding a copy of the patch's value (it is added when absent and replaced when present); receiver members that `patch` does not mention are untouched. If either of the two is not an object (null, bool, number, string or array), the receiver becomes a copy of `patch`. The `overwrite` argument only has an effect where a later requirement says so.\n2. **Fill-only mode.** Call `merge(patch, false)` with `overwrite == false` is a fill-only merge: if both values are objects, only members of `patch` whose name is absent from the receiver are added (as described for the basic merge); every member the receiver already has is left exactly as it is - not replaced, not removed, not merged into - and no recursion into nested objects takes place. If either value is not an object the receiver is left unchanged. With `overwrite == true` this requirement changes nothing.\n3. **Keep on kind mismatch.** Classify values into three kinds: object, array, and scalar (null, bool, any number, string). When the receiver and the patch both have a member of the same name and those two member values are of different kinds, the receiver's value is kept unchanged. Values of the same kind are handled by the other requirements. This applies to members only, never to the receiver and patch as a whole.\n4. **Deep merge.** When the receiver and the patch both have a member of the same name and both member values are objects, those two objects are merged member by member, recursively, by the same rules, instead of the patch's object replacing the receiver's.\n5. **Depth limit.** Recursive object merging stops at depth 3. Count depth as follows: members of the top-level objects are at depth 1, members of their members at depth 2, and so on. Two object-valued members at depth d are merged recursively only if d < 3; otherwise the patch's object replaces the receiver's (as in the basic merge).\n6. **Concatenate arrays.** If both values are arrays - the receiver and the patch as a whole, or two members of the same name - the receiver's array becomes its own elements followed by all elements of the patch's array, in order. Elements are copied as they are, never merged with each other.\n7. **Skip duplicate elements.** When concatenating arrays, an element of the patch array is appended only if no element currently in the receiver's array (including elements appended earlier in the same concatenation) is equal to it, where equal means `Json::Value::operator==`. The receiver's own elements are never removed or reordered, even when duplicated.\n\n## Notes\n\n- Do not modify existing tests. Hidden tests cover every numbered requirement above and the repository's existing test-suite must keep passing.\n- Anything not stated above is unspecified and is not tested.\n","demo":{"reference solution":{"fail_to_pass":"59/59","pass_to_pass":"133/133","per_rule":{"arrconcat":"7/7","arrunion":"9/9","core":"16/16","deep":"5/5","depthlimit":"4/4","keepmismatch":"8/8","noover":"10/10"},"build_ok":true,"verdict":"RESOLVED"},"plausible solution missing requirement 'noover'":{"fail_to_pass":"51/59","pass_to_pass":"133/133","per_rule":{"arrconcat":"7/7","arrunion":"9/9","core":"16/16","deep":"5/5","depthlimit":"4/4","keepmismatch":"8/8","noover":"2/10"},"build_ok":true,"verdict":"UNRESOLVED"},"plausible solution missing requirement 'keepmismatch'":{"fail_to_pass":"51/59","pass_to_pass":"133/133","per_rule":{"arrconcat":"6/7","arrunion":"9/9","core":"16/16","deep":"4/5","depthlimit":"4/4","keepmismatch":"2/8","noover":"10/10"},"build_ok":true,"verdict":"UNRESOLVED"},"empty patch":{"fa s a whole.\n5. **Concatenate arrays.** If both values are arrays - the receiver and the patch as a whole, or two members of the same name - the receiver's array becomes its own elements followed by all elements of the patch's array, in order. Elements are copied as they are, never merged with each other.\n6. **Self merge.** Merging a value into itself, `v.merge(v)`, leaves `v` unchanged (whatever its content).\n\n## Notes\n\n- Do not modify existing tests. Hidden tests cover every numbered requirement above and the repository's existing test-suite must keep passing.\n- Anything not stated above is unspecified and is not tested.\n","demo":null,"dir":"/Users/abhi81/kiroween/task-factory/tasks/jsoncpp/merge-03"},{"id":"jsoncpp/merge-04","repo":"jsoncpp","family":"merge","title":"Add `Json::Value::merge` (deep merge of JSON documents)","difficulty":"hard","base_commit":"93acc7b155048f1a66c43235cc205519f1e7a6ea","language":"cpp","f2p":58,"p2p":133,"rules":[{"id":"core","title":"Basic merge","requirement":"Add a public member function `Value& merge(const Value& patch, bool overwrite = true)` to `Json::Value` (declared in `include/json/value.h`, defined in `src/lib_json/json_value.cpp`). It merges `patch` into the receiver (`*this`), never modifies `patch`, copies (does not alias) whatever it takes from `patch`, and returns a reference to the receiver. If both the receiver and `patch` are objects, then for every member of `patch` the receiver ends up with a member of that name holding a copy of the patch's value (it is added when absent and replaced when present); receiver members that `patch` does not mention are untouched. If either of the two is not an object (null, bool, number, string or array), the receiver becomes a copy of `patch`. The `overwrite` argument only has an effect where a later requirement says so."},{"id":"nulldel","title":"Null deletes","requirement":"A member of the patch object whose value is null is never copied into the receiver: if the receiver ha ny number, string). When the receiver and the patch both have a member of the same name and those two member values are of different kinds, the receiver's value is kept unchanged. Values of the same kind are handled by the other requirements. This applies to members only, never to the receiver and patch as a whole.\n4. **Deep merge.** When the receiver and the patch both have a member of the same name and both member values are objects, those two objects are merged member by member, recursively, by the same rules, instead of the patch's object replacing the receiver's.\n5. **Concatenate arrays.** If both values are arrays - the receiver and the patch as a whole, or two members of the same name - the receiver's array becomes its own elements followed by all elements of the patch's array, in order. Elements are copied as they are, never merged with each other.\n6. **Skip duplicate elements.** When concatenating arrays, an element of the patch array is appended only if no element currently in the receiver's array (including elements appended earlier in the same concatenation) is equal to it, where equal means `Json::Value::operator==`. The receiver's own elements are never removed or reordered, even when duplicated.\n7. **Self merge.** Merging a value into itself, `v.merge(v)`, leaves `v` unchanged (whatever its content).\n\n## Notes\n\n- Do not modify existing tests. Hidden tests cover every numbered requirement above and the repository's existing test-suite must keep passing.\n- Anything not stated above is unspecified and is not tested.\n","demo":null,"dir":"/Users/abhi81/kiroween/task-factory/tasks/jsoncpp/merge-04"},{"id":"zod/unique-01","repo":"zod","family":"unique","title":"Add `.unique()` to `ZodArray`","difficulty":"medium","base_commit":"d40c329910436e528d3c26cb1b9179e05abebf05","language":"ts","f2p":34,"p2p":2875,"rules":[{"id":"core","title":"Basic uniqueness","requirement":"Add a method `unique(options?)` to `ZodArray` (classic API, `packages/zod/src/v4/c t objects are never equal even if they look alike, the same object twice is). Items are compared as the *parsed output* values (so with `z.string().trim()` the items `\" a\"` and `\"a\"` are duplicates). Every issue it reports has `code: \"custom\"` and a non-empty `message`. An array without duplicates passes; the empty array and one-element arrays pass.\n2. **Uniqueness by key.** `options.by` is an optional function `(item, index) => unknown`; when given, the keys it returns (instead of the items) are compared for equality.\n3. **Ignore nullish.** `options.ignoreNullish: true`: items (or keys, when `by` is used) that are `null` or `undefined` never count as duplicates of each other.\n4. **One issue per duplicate.** Instead of one issue for the whole array, report one issue for every duplicate occurrence, i.e. every item that equals some EARLIER item (the first occurrence is never reported). Each issue's `path` is `[index]` of that item, relative to the array (so inside `z.object({ tags })` the full path is `[\"tags\", index]`), and issues are ordered by index. Without this behaviour there is exactly one issue and its `path` is the array's own (empty at top level).\n5. **First duplicate only.** Only the issue for the first duplicate occurrence (lowest index) is reported.\n6. **Custom message.** `options.message` (a string) is used as the `message` of every issue the check reports.\n\n## Notes\n\n- Do not modify existing tests. Hidden tests cover every numbered requirement above and the repository's existing test-suite must keep passing.\n- Anything not stated above is unspecified and is not tested.\n","demo":null,"dir":"/Users/abhi81/kiroween/task-factory/tasks/zod/unique-01"},{"id":"zod/unique-02","repo":"zod","family":"unique","title":"Add `.unique()` to `ZodArray`","difficulty":"medium","base_commit":"d40c329910436e528d3c26cb1b9179e05abebf05","language":"ts","f2p":35,"p2p":2875,"rules":[{"id":"core","title":"Basic uniqueness","requirement":"Add a method `unique( /* ───────────────────────── Atlas (all tasks as a galaxy) ───────────────────────── */

/* ───────────────────────── Pipeline station ───────────────────────── */
const P = { core: null, rules: [], gates: [], cubes: null, tstate: [], trule: [], mut: null, packet: null, mstate: [], coreGlow: null };
function clearGroup(g) { while (g.children.length) { const c = g.children.pop(); c.parent = null; } }

function buildPipeline(t) {
  clearGroup(pipeG);
  const rc = REPO_COL[t.repo] || 0x4cc9f0;
  // core
  const core = new THREE.Group();
  core.add(new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(1.7, 1)), new THREE.LineBasicMaterial({ color: rc, transparent: true, opacity: 0.9 })));
  const inner = new THREE.Mesh(new THREE.SphereGeometry(0.95, 32, 24), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  core.add(inner); const cg = glow(rc, 9, 0.9); core.add(cg); P.coreGlow = cg; P.core = core;
  label(`variant ${t.id.split('/')[1]}`, 'core', core, [0, 2.9, 0]);
  pipeG.add(core);
  // rules orbit
  P.rules = [];
  t.rules.forEach((r, i) => {
    const grp = new THREE.Group(); grp.rotation.set(0.35 * Math.sin(i * 2.1), i * 0.9, 0.5 * Math.cos(i * 1.7));
    const rad = 3.8 + (i % 3) * 0.95, color = RULE_PAL[i % RULE_PAL.length];
    const ringG = new THREE.BufferGeometry().setFromPoints(Array.from({ length: 65 }, (_, k) => new THREE.Vector3(Math.cos(k / 64 * 6.283) * rad, 0, Math.sin(k / 64 * 6.283) * rad)));
    grp.add(new THREE.Line(ringG, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.18 })));
    const orb = new THREE.Mesh(new THREE.SphereGeometry(r.id === 'core' ? 0.42 : 0.3, 20, 16), new THREE.MeshBasicMaterial({ color }));
    orb.add(glow(color, 2.4, 0.9)); orb.userData = { type: 'rule', id: r.id, idx: i, color, rad, spd: 0.25 + (i % 4) * 0.07, a: i * 1.3 };
    label(r.id, '', orb, [0, 0.4, 0]);
    grp.add(orb); pipeG.add(grp); P.rules.push({ grp, orb, color });
  });
  // tests platform (one cube per fail-to-pass test, coloured by rule)
  const total = t.rules.reduce((a, r) => a + (t.tests_by_rule[r.id] || 0), 0);
  P.trule = []; t.rules.forEach((r, i) => { for (let k = 0; k < (t.tests_by_rule[r.id] || 0); k++) P.trule.push(i); });
  P.cubes = new THREE.InstancedMesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshBasicMaterial({ toneMapped: false }), Math.max(1, total));
  P.tstate = P.trule.map(() => ({ v: 0 }));

  pipeG.add(P.cubes);
  const grid = new THREE.GridHelper(14, 28, 0x2a3566, 0x1a2144); grid.position.set(0, -7.4, 0); grid.material.transparent = true; grid.material.opacity = 0.55; pipeG.add(grid);
  label(`${t.f2p} feature tests · one cube each`, '', pipeG, [0, -5.2, 0]);
  // gates
  P.gates.forEach((g) => g.dispose?.()); P.gates = [];
  const rail = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(2.5, 0, 0), new THREE.Vector3(36, 0, 0)]), new THREE.LineBasicMaterial({ color: 0x2c3a78, transparent: true, opacity: 0.7 }));
  pipeG.add(rail);

    const g = new THREE.Group(); g.position.set(8 + i * 4.3, 0, 0);

    ring.rotation.y = Math.PI / 2; g.add(ring);

    disc.rotation.y = Math.PI / 2; g.add(disc);

  }
  // packet
  const pk = new THREE.Mesh(new THREE.OctahedronGeometry(0.32), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  pk.add(glow(0xffffff, 3.4)); pk.position.set(2.5, 0, 0); pk.visible = false; pipeG.add(pk); P.packet = pk;
  // mutants swarm (around gate S5)
  const st5 = t.stages.S5_mutation_kill; const nm = Math.min(48, (st5.killed || 0) + (st5.survived || 0));

  P.mstate = Array.from({ length: nm }, (_, i) => ({ survived: i >= (st5.killed || 0) * nm / Math.max(1, (st5.killed || 0) + (st5.survived || 0)), a: Math.random() * 6.28, r: 2 + Math.random() * 1.2, y: (Math.random() - 0.5) * 2, k: 0 }));
  P.mstate.forEach((m, i) => P.mut.setColorAt(i, tmpC.set(0x7a86b8)));
  P.mut.visible = true; pipeG.add(P.mut);
  S.ablated.clear(); renderStageList(t); renderRules(t);
}

/* per-frame animation of the pipeline station */
function animatePipeline(dt, time) {
  if (!P.core) return;
  P.core.rotation.y += dt * 0.5; P.core.rotation.x += dt * 0.2;
  P.core.scale.setScalar(1 + Math.sin(time * 2) * 0.03);
  P.rules.forEach(({ grp, orb }) => { orb.userData.a += dt * orb.userData.spd; const u = orb.userData; orb.position.set(Math.cos(u.a) * u.rad, 0, Math.sin(u.a) * u.rad); });
  // cubes
  const cols = 14;
  P.trule.forEach((ri, i) => {
    const c = i % cols, r = Math.floor(i / cols), f = P.tstate[i].v;
    const shake = f > 0.01 && f < 0.99 ? Math.sin(time * 60 + i) * 0.05 : 0;
    tmpP.set((c - (cols - 1) / 2) * 0.46 + shake, -6.9 + Math.sin(time * 1.4 + i * 0.5) * 0.06 - f * 0.45, (r - 2) * 0.46);
    tmpS.setScalar(1 - f * 0.35); tmpM.compose(tmpP, tmpQ.identity(), tmpS); P.cubes.setMatrixAt(i, tmpM);
    tmpC.set(RULE_PAL[ri % RULE_PAL.length]).lerp(new THREE.Color(0xef476f), f); P.cubes.setColorAt(i, tmpC);
  });
  P.cubes.instanceMatrix.needsUpdate = true; if (P.cubes.instanceColor) P.cubes.instanceColor.needsUpdate = true;
  // gates idle pulse
  P.gates.forEach((g, i) => { const u = g.userData; g.rotation.x += dt * (u.status === 'idle' ? 0.4 : 0.9); u.disc.material.opacity = 0.05 + (u.status !== 'idle' ? 0.12 : 0) + u.pulse * 0.5; u.pulse *= 0.93; });
  // mutants
  const g5 = P.gates[4]; if (g5) P.mstate.forEach((m, i) => {
    m.a += dt * (m.survived ? 1.4 : 0.9); const k = m.k;
    const rad = m.r + k * 6, y = m.y + (m.survived ? Math.sin(time * 3 + i) * 0.2 : k * (i % 2 ? 2 : -2));
    tmpP.set(g5.position.x + Math.sin(m.a) * 0.6, y + Math.sin(m.a * 1) * 0.0, Math.cos(m.a) * rad * 0.7);
    tmpS.setScalar(m.survived ? 1.15 : Math.max(0.001, 1 - k)); tmpM.compose(tmpP, tmpQ.setFromEuler(new THREE.Euler(time + i, time, 0)), tmpS); P.mut.setMatrixAt(i, tmpM);
  });
  if (P.mut) P.mut.instanceMatrix.needsUpdate = true;
}

/* gate activation + stage list */
const STAT_COL = { ok: 0x06d6a0, warn: 0xffd166, bad: 0xef476f, na: 0x8a93b2, idle: 0x3a4a9a };
function resetGates() {
  P.gates.forEach((g) => { g.userData.status = 'idle'; g.userData.ring.material.color.set(STAT_COL.idle); });
  P.mstate.forEach((m) => { m.k = 0; }); P.cubes && P.tstate.forEach((s) => { s.v = 0; });
  $$('#stagelist li').forEach((li) => { li.className = ''; $('i', li).textContent = '—'; });
}
function activateGate(i, status, text) {
  const g = P.gates[i]; if (!g) return; const u = g.userData; u.status = status; u.pulse = 1;
  gsap.to(u.ring.material.color, { ...new THREE.Color(STAT_COL[status]), duration: 0.35 });
  gsap.fromTo(g.scale, { x: 1.5, y: 1.5, z: 1.5 }, { x: 1, y: 1, z: 1, duration: 0.8, ease: 'elastic.out(1,0.4)' });
  shockwave(g.getWorldPosition(new THREE.Vector3()), STAT_COL[status], 4);
  const li = $(`#stagelist li[data-i="${i}"]`); if (li) { li.className = status; $('i', li).textContent = text; }
}
function stageInfo(t) {

  const s1 = s.S1_base_fails, s4 = Object.values(s.S4_rule_ablations.per_rule), s5 = s.S5_mutation_kill, s6 = s.S6_regression_guard;
  const guards = s1.guard_tests_passing_on_base ?? (s1.passing_on_base?.length || 0);
  return [
    { status: s1.ok ? 'ok' : 'bad', text: `${n(s1.failing) || t.f2p} fail on base${guards ? ` · ${guards} guards` : ''}` },
    { status: s.S2_reference_passes.ok ? 'ok' : 'bad', text: `${s.S2_reference_passes.passed} feature tests pass` },
    { status: s.S3_regression_intact.ok ? 'ok' : 'bad', text: `${s.S3_regression_intact.passed} existing intact` },
    { status: s.S4_rule_ablations.ok ? 'ok' : 'bad', text: `${s4.filter((a) => a.caught).length}/${s4.length} rules caught` },
    { status: s5.ok ? 'ok' : 'warn', text: `${s5.killed}/${s5.killed + s5.survived} mutants killed (${Math.round(s5.score * 100)}%)` },
    s6.applicable === false ? { status: 'na', text: 'n/a (additive patch)' }
      : { status: s6.ok ? 'ok' : 'warn', text: `${s6.killed_by_existing_suite + s6.killed_by_feature_tests}/${s6.killed_by_existing_suite + s6.killed_by_feature_tests + s6.survived} caught` },
    { status: s.S7_determinism.ok ? 'ok' : 'bad', text: 'deterministic' },
  ];
}
function movePacket(i) {

}
async function replay(t = S.sel) {
  if (S.running || !t) return; S.running = true; flyTo('pipeline'); setTab('task'); resetGates();
  P.packet.position.x = 2.5; await sleep(500);
  const info = stageInfo(t);
  for (let i = 0; i < 7; i++) {
    gsap.to(controls.target, { x: 8 + i * 4.3 - 3, duration: 0.9, ease: 'power2.out' });

}
function mutantBurst() { P.mstate.forEach((m, i) => { if (!m.survived) gsap.to(m, { k: 1, duration: 1.2 + Math.random() * 0.6, delay: i * 0.015, ease: 'power2.out' }); }); }

/* effects */
const waves = [];
function shockwave(pos, color = 0xffffff, size = 5) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.28, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false, toneMapped: false }));
  m.position.copy(pos); m.lookAt(camera.position); scene.add(m);
  gsap.to(m.scale, { x: size * 4, y: size * 4, duration: 1.1, ease: 'power2.out' });

}
function shake(amount = 0.25) {
  gsap.fromTo(camera.position, { x: '+=0' }, { x: `+=${amount}`, y: `+=${amount * 0.6}`, duration: 0.05, repeat: 7, yoyo: true, ease: 'sine.inOut' });
}
function bloomPulse(v = 1.8) { gsap.fromTo(bloom, { strength: v }, { strength: 0.95, duration: 1.2, ease: 'power2.out' }); }

/* ablation: remove a rule → its tests light up red (real evidence from validation S4) */
function ablate(ruleId) {
  const t = S.sel; if (!t) return; const ev = t.stages.S4_rule_ablations.per_rule[ruleId];
  if (!ev) { toast('`core` is always on — it is never ablated'); return; }
  const idxOf = (id) => t.rules.findIndex((r) => r.id === id);
  const on = !ev.dropped.every((d) => S.ablated.has(d));
  if (on) ev.dropped.forEach((d) => S.ablated.add(d)); else ev.dropped.forEach((d) => S.ablated.delete(d));
  const targets = []; P.trule.forEach((ri, i) => { if (ev.dropped.includes(t.rules[ri].id)) targets.push(i); });
  const hit = targets.slice(0, ev.caught_by || targets.length);
  hit.forEach((ci, k) => gsap.to(P.tstate[ci], { v: on ? 1 : 0, duration: 0.5, delay: k * 0.03 }));
  ev.dropped.forEach((d) => {
    const r = P.rules[idxOf(d)]; if (!r) return;
    gsap.to(r.orb.material.color, { ...new THREE.Color(on ? 0xef476f : r.color), duration: 0.4 });
    gsap.fromTo(r.orb.scale, { x: 2, y: 2, z: 2 }, { x: 1, y: 1, z: 1, duration: 0.9, ease: 'elastic.out(1,0.4)' });
    if (on) shockwave(r.orb.getWorldPosition(new THREE.Vector3()), 0xef476f, 3);
  });
  if (on) { shake(0.18); bloomPulse(1.6); }
  banner(on ? `S4 · remove “${ruleId}”${ev.dropped.length > 1 ? ` (+ ${ev.dropped.filter((d) => d !== ruleId).join(', ')})` : ''} → ${ev.caught_by} tests fail — the rule is independently tested`
    : `“${ruleId}” restored`);
  $$('#rules .rule').forEach((el) => el.classList.toggle('off', S.ablated.has(el.dataset.id)));
}
async function tourAblations(t, quiet) {
  if (!t) return; for (const r of t.rules) { if (r.id === 'core') continue; ablate(r.id); await sleep(quiet ? 260 : 700); }
  await sleep(quiet ? 500 : 1200);
  for (const r of t.rules) if (S.ablated.has(r.id)) { ablate(r.id); await sleep(80); }
}

/* ───────────────────────── Variation station ───────────────────────── */
let bars = [];
function buildVariation(t) {
  clearGroup(varG); bars = [];
  const fam = S.families.find((f) => f.repo === t.repo && f.family === t.family); const M = fam?.matrix;
  const grid = new THREE.GridHelper(20, 20, 0x2a3566, 0x1a2144); grid.position.y = -0.01; varG.add(grid);
  label(`${t.repo}/${t.family} · tests (rows) vs reference (cols)`, 'fam', varG, [0, 7.5, -8]);
  if (!M) { label('no variation matrix for this family yet', '', varG, [0, 2, 0]); return; }
  const n = M.variants.length, sp = 2.4, off = ((n - 1) * sp) / 2;
  M.m.forEach((row, i) => row.forEach((v, j) => {
    const h = Math.max(0.12, v * 6), diag = i === j;

    m.position.set(j * sp - off, h / 2, i * sp - off); m.scale.y = 0.001;
    m.userData = { type: 'bar', i, j, v, a: M.variants[i], b: M.variants[j], h }; varG.add(m); bars.push(m); pickables.push(m);
    gsap.to(m.scale, { y: 1, duration: 1.1, delay: 0.2 + (i + j) * 0.07, ease: 'back.out(1.6)' });
  }));
  M.variants.forEach((v, k) => { label(v.split('-')[1], 'gate', varG, [k * sp - off, 0, off + 2]); label(v.split('-')[1], 'gate', varG, [-off - 2, 0, k * sp - off]); });
}

  hoverEl.innerHTML = html; hoverEl.style.left = e.clientX + 'px'; hoverEl.style.top = e.clientY + 'px'; hoverEl.style.opacity = 1;

function log(line, cls = '') { const l = $('#log'); const d = document.createElement('div'); if (cls) d.className = cls === 'ok' || cls === 'bad' || cls === 'warn' ? cls : ''; d.textContent = line; l.appendChild(d); l.scrollTop = l.scrollHeight; }

/* ───────────────────────── Grader ───────────────────────── */
function renderGrader(t) {
  const p = $('#tab-grader');
  p.innerHTML = `<h4>Grade a candidate solution</h4><div class="sub">Applies the candidate patch + hidden tests at the pinned commit. ${S.live ? '<b style="color:var(--ok)">Real run.</b>' : 'Static mode replays recorded evidence.'}</div>
   <div class="row"><button class="btn" data-c="reference">Reference</button><button class="btn ghost" data-c="empty">Empty patch</button><button class="btn ghost" data-c="tamper">Edits the tests</button></div>
   <div class="row"><select id="abl">${t.rules.filter((r) => r.id !== 'core').map((r) => `<option value="${r.id}">forgets “${r.id}”</option>`).join('')}</select><button class="btn ghost" data-c="ablate">Run plausible-but-incomplete</button></div>
   <div id="gres"></div>`;
  $$('#tab-grader [data-c]').forEach((b) => b.onclick = () => grade(b.dataset.c === 'ablate' ? 'ablate:' + $('#abl').value : b.dataset.c));
}
function staticGrade(t, c) {
  if (c === 'tamper') return { verdict: 'REJECTED', reason: 'candidate edits protected test files' };
  const per = {}; t.rules.forEach((r) => (per[r.id] = [0, t.tests_by_rule[r.id] || 0]));
  let f = 0; const tot = t.f2p;
  if (c === 'reference') { t.rules.forEach((r) => (per[r.id][0] = per[r.id][1])); f = tot; }
  else if (c.startsWith('ablate:')) {
    const ev = t.stages.S4_rule_ablations.per_rule[c.slice(7)]; let left = ev.caught_by;
    t.rules.forEach((r) => { const fail = ev.dropped.includes(r.id) ? Math.min(left, per[r.id][1]) : 0; left -= fail; per[r.id][0] = per[r.id][1] - fail; });
    f = Object.values(per).reduce((a, [x]) => a + x, 0);
  }
  return { verdict: f === tot ? 'RESOLVED' : 'UNRESOLVED', f2p: [f, tot], p2p: [t.p2p, t.p2p], per, note: 'derived from recorded validation evidence' };
}
async function grade(c) {
  const t = S.sel; const box = $('#gres'); box.innerHTML = '<div class="res">running…</div>'; log(`grade ${t.id} :: ${c}`); let r;
  if (S.live) {
    try {
      const j = await (await fetch('/api/evaluate', { method: 'POST', body: JSON.stringify({ task: t.id, candidate: c }) })).json();
      if (j.error) throw new Error(j.error);
      if (j.verdict === 'REJECTED') r = { verdict: 'REJECTED', reason: j.reason };
      else { const pr = (s) => s.split('/').map(Number); r = { verdict: j.verdict, f2p: pr(j.fail_to_pass), p2p: pr(j.pass_to_pass), per: Object.fromEntries(Object.entries(j.per_rule).map(([k, v]) => [k, pr(v)])), note: `real grader run · ${j.seconds}s` }; }
    } catch (e) { box.innerHTML = `<div class="res" style="color:var(--bad)">${esc(e.message)}</div>`; return; }
  } else { await sleep(500); r = staticGrade(t, c); }
  flyTo('pipeline', 1.2);
  box.innerHTML = `<div class="res"><div class="verdict ${r.verdict}">${r.verdict}</div>
   ${r.reason ? `<div class="sub">${esc(r.reason)}</div>` : `<div class="kv"><span>fail→pass</span><b>${r.f2p[0]}/${r.f2p[1]}</b></div><div class="bar ${r.f2p[0] < r.f2p[1] ? 'partial' : ''}"><div data-w="${r.f2p[0] / Math.max(1, r.f2p[1])}"></div></div>
   <div class="kv"><span>pass→pass</span><b>${r.p2p[0]}/${r.p2p[1]}</b></div><div class="bar"><div data-w="${r.p2p[0] / Math.max(1, r.p2p[1])}"></div></div>
   <h4 style="margin-top:12px">per requirement</h4>${Object.entries(r.per).map(([k, [a, b]]) => `<div class="kv"><span>${esc(k)}</span><b>${a}/${b}</b></div><div class="bar ${a < b ? 'partial' : ''}"><div data-w="${b ? a / b : 1}"></div></div>`).join('')}
   <div class="sub">${esc(r.note)}</div>`}</div>`;
  $$('#gres .bar>div').forEach((d, i) => gsap.to(d, { width: (parseFloat(d.dataset.w) * 100) + '%', duration: 0.9, delay: i * 0.05, ease: 'power3.out' }));
  const col = { RESOLVED: 0x06d6a0, UNRESOLVED: 0xef476f, REJECTED: 0xffd166 }[r.verdict];
  shockwave(P.core.getWorldPosition(new THREE.Vector3()), col, 6); bloomPulse(2.2); gsap.to(P.coreGlow.material.color, { ...new THREE.Color(col), duration: 0.4, yoyo: true, repeat: 1 });
  banner(`${r.verdict} — ${r.f2p ? `${r.f2p[0]}/${r.f2p[1]} requirement tests pass` : r.reason}`);
  if (r.per) t.rules.forEach((ru, i) => { const [a, b] = r.per[ru.id] || [0, 0]; const fail = b - a; P.trule.forEach((ri, k) => { if (ri === i) gsap.to(P.tstate[k], { v: 0, duration: 0.1 }); }); let n = 0; P.trule.forEach((ri, k) => { if (ri === i && n++ < fail) gsap.to(P.tstate[k], { v: 1, duration: 0.5, delay: k * 0.01 }); }); });
  if (r.verdict === 'RESOLVED') P.tstate.forEach((s) => gsap.to(s, { v: 0, duration: 0.4 }));
}

/* ───────────────────────── Lab: compose your own task ───────────────────────── */
function closedSubsets(fam) { // how many distinct tasks can this family generate?
  const opt = fam.all_rules.filter((r) => r.id !== 'core'); let n = 0;
  for (let m = 0; m < 1 << opt.length; m++) { const sel = new Set(opt.filter((_, i) => m >> i & 1).map((r) => r.id)); if (opt.every((r) => !sel.has(r.id) || r.needs.every((d) => d === 'core' || sel.has(d)))) n++; }
  return n;
}
function renderLab() {
  const p = $('#tab-lab'); const fams = S.families.filter((f) => f.all_rules?.length);
  p.innerHTML = `<h4>Rule lab — compose a new task</h4><div class="sub">Pick a family and any combination of behavioural rules. ${S.live ? 'The factory will really generate, validate and package it.' : '<b style="color:var(--warn)">Static mode:</b> start the live server to build.'}</div>
   <div class="row"><select id="lfam">${fams.map((f) => `<option>${f.repo}/${f.family}</option>`).join('')}</select><input id="lseed" type="number" value="${40 + Math.floor(Math.random() * 50)}" style="width:80px" title="seed"></div>
   <div id="lrules"></div><div class="sub" id="lcount"></div><div class="row"><button class="btn" id="lbuild">⚡ Build &amp; validate live</button></div>`;
  const draw = () => {
    const fam = fams.find((f) => `${f.repo}/${f.family}` === $('#lfam').value);
    $('#lrules').innerHTML = fam.all_rules.map((r) => `<label class="check"><input type="checkbox" data-r="${r.id}" ${r.id === 'core' ? 'checked disabled' : ''}><span><b>${r.id}</b> — ${esc(r.title)}${r.needs.length ? `<small>needs ${r.needs.join(', ')}</small>` : ''}</span></label>`).join('');
    $('#lcount').innerHTML = `This family can generate <b style="color:var(--acc)">${closedSubsets(fam)}</b> distinct tasks (rule combinations) × parameter choices.`;
    $$('#lrules input').forEach((c) => c.onchange = () => { // auto-select dependencies
      if (c.checked) fam.all_rules.find((r) => r.id === c.dataset.r).needs.forEach((d) => { const x = $(`#lrules [data-r="${d}"]`); if (x) x.checked = true; });
    });
  };
  $('#lfam').onchange = draw; draw();
  $('#lbuild').disabled = !S.live;
  $('#lbuild').onclick = () => {
    const [repo, family] = $('#lfam').value.split('/'); const rules = $$('#lrules input:checked').map((c) => c.dataset.r);
    liveBuild({ repo, family, rules, seed: +$('#lseed').value, mutants: 8 });
  };
}

/* live build: stream the REAL factory log and drive the gates from it */
async function liveBuild(body) {
  if (S.running) return; S.running = true; flyTo('pipeline'); setTab('task');
  const seed = body.seed; const idGuess = `${body.repo}/${body.family}-${String(seed).padStart(2, '0')}`;
  log(`▶ live build ${idGuess} rules=${(body.rules || []).join(',') || 'sampled'}`);
  const tmp = S.tasks.find((t) => t.repo === body.repo && t.family === body.family) || S.tasks[0]; if (S.sel?.id !== tmp.id) selectTask(tmp.id, { fly: false }); resetGates();
  P.packet.visible = true; P.packet.position.x = 2.5;
  try {
    const res = await fetch('/api/build', { method: 'POST', body: JSON.stringify(body) });
    if (!res.ok) { toast((await res.json()).error || 'build failed'); S.running = false; return; }
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        const j = JSON.parse(p.replace(/^data: /, '')); if (j.done) continue; const line = j.line;
        const m = line.match(/^\s*S([1-7])\s+.+?\s{2,}(PASS|FAIL|WARN|n\/a)\b(.*)$/);
        if (m) { const i = +m[1] - 1, st = { PASS: 'ok', FAIL: 'bad', WARN: 'warn', 'n/a': 'na' }[m[2]]; await movePacket(i); activateGate(i, st, (m[3] || '').trim().replace(/^[(]|[)]$/g, '') || m[2]); if (i === 4) mutantBurst(); log(line.trim(), st === 'ok' ? 'ok' : st === 'bad' ? 'bad' : 'warn'); }
        else log(line);
      }
    }
    P.packet.visible = false;
    const j = await (await fetch('/api/live')).json();
    S.liveIds = new Set(j.tasks.map((t) => t.id)); const keep = S.tasks.filter((t) => !S.liveIds.has(t.id)); S.tasks = [...keep, ...j.tasks];
    S.families = mergeFamilies(S.families, j.families);
    buildAtlas(); renderTaskList(); const nt = j.tasks.find((t) => t.id === idGuess) || j.tasks.at(-1);
    if (nt) { selectTask(nt.id, { fly: false }); banner(`✦ new task generated & validated: ${nt.id}`); bloomPulse(2.4); }
  } catch (e) { toast('live build error: ' + e.message); }
  S.running = false;
}
function mergeFamilies(base, extra) {
  const out = base.map((f) => ({ ...f })); extra.forEach((f) => { const o = out.find((x) => x.repo === f.repo && x.family === f.family); if (o) o.tasks = [...new Set([...o.tasks, ...f.tasks])]; else out.push(f); }); return out;
}

const ctx = { THREE, gsap, scene, camera, controls, bloom, S, P, pipeG, atlasG, varG, flyTo, shockwave, shake, bloomPulse, toast, banner, log, glow, label, replay, ablate, selectTask, sleep, REPO_COL, RULE_PAL, registerInteraction };

<pre class="code">// app/custom-interactions.js

  $$('#tab-play .ix').forEach((el) => el.onclick = () => { const d = Interactions[+el.dataset.i]; try { d.run(ctx); } catch (e) { toast(d.label + ': ' + e.message); console.error(e); } });
}
registerInteraction({ id: 'tour', icon: '🔬', label: 'Ablation tour', desc: 'remove every rule in turn: each one lights up its own tests', run: ({ flyTo, S, ablate }) => { flyTo('pipeline'); tourAblations(S.sel); } });
registerInteraction({ id: 'explode', icon: '💥', label: 'Explode tests', desc: 'scatter the test cubes and pull them back together', run: ({ P, gsap }) => { P.tstate.forEach((s, i) => gsap.to(s, { v: 1, duration: 0.4, delay: i * 0.01, yoyo: true, repeat: 1, ease: 'power2.out' })); } });
registerInteraction({ id: 'storm', icon: '🧬', label: 'Mutation storm', desc: 'replay S5: mutants are killed, survivors stay red', run: ({ P, flyTo, S }) => { flyTo('pipeline'); P.mstate.forEach((m) => (m.k = 0)); P.mstate.forEach((m, i) => { if (!m.survived) gsap.to(m, { k: 1, duration: 1.4, delay: 0.5 + i * 0.02 }); }); } });
registerInteraction({ id: 'warp', icon: '🌌', label: 'Warp tour', desc: 'cinematic flight through all three stations', run: async ({ flyTo, sleep }) => { flyTo('atlas', 1.6); await sleep(1800); flyTo('pipeline', 2.4); await sleep(2800); flyTo('variation', 2.4); await sleep(2800); flyTo('atlas', 2.4); } });
registerInteraction({ id: 'hue', icon: '🎨', label: 'Theme shift', desc: 'rotate the bloom and star colours', run: ({ gsap, bloom }) => { gsap.fromTo(bloom, { strength: 2.2, radius: 1.1 }, { strength: 0.95, radius: 0.65, duration: 1.6 }); gsap.to(stars.rotation, { y: '+=1.2', duration: 3, ease: 'power2.inOut' }); } });

/* ───────────────────────── selection + boot ───────────────────────── */
function selectTask(id, { fly = true } = {}) {
  const t = S.tasks.find((x) => x.id === id); if (!t) return; S.sel = t;
  buildPipeline(t); renderGrader(t); buildVariation(t); refreshSelectionHalo(); renderTaskList();
  $('#tab-task').scrollTop = 0; if (fly) { flyTo('pipeline'); }
  const i = stageInfo(t); if (fly) setTimeout(() => replay(t), 2300);
}

const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  controls.update(); stars.rotation.y += dt * 0.004;
  atlasNodes.forEach((m) => { const u = m.userData; m.position.y = u.base.y + Math.sin(time * 0.8 + u.ph) * 0.25; m.scale.setScalar(m === hovered ? 1.35 : 1); });
  if (halo.visible) { halo.rotation.x = Math.PI / 2 + Math.sin(time) * 0.2; halo.rotation.z = time; const n = atlasNodes.find((m) => m.userData.id === S.sel?.id); if (n) halo.position.copy(n.position); }
  animatePipeline(dt, time);
  composer.render(); labelRenderer.render(scene, camera); requestAnimationFrame(loop);
}

async function boot() {
  let data = window.FACTORY_DATA;
  try { const h = await fetch('/api/health', { signal: AbortSignal.timeout(900) }); if (h.ok) { S.live = true; data = await (await fetch('/api/data')).json(); const lv = await (await fetch('/api/live')).json(); lv.tasks.forEach((t) => S.liveIds.add(t.id)); data.tasks.push(...lv.tasks); data.families = mergeFamilies(data.families, lv.families); } } catch (e) { /* static mode */ }
  S.tasks = data.tasks; S.families = data.families;
  const pill = $('#mode'); pill.className = 'pill ' + (S.live ? 'live' : 'static'); pill.textContent = S.live ? 'LIVE · real factory attached' : 'STATIC · recorded evidence';
  buildAtlas(); renderTaskList(); renderLab(); renderPlay();
  selectTask(S.tasks.find((t) => t.id === 'zod/unique-02')?.id || S.tasks[0].id, { fly: false }); S.sel = S.tasks[0];
  selectTask(S.sel.id, { fly: false });
  const t = S.sel; flyTo('atlas', 3.2);
  gsap.from('#top > *', { y: -30, opacity: 0, stagger: 0.12, duration: 0.9, ease: 'power3.out' });
  gsap.from('#left', { x: -40, opacity: 0, duration: 1, delay: 0.5, ease: 'power3.out' });

  setTimeout(() => banner('Click a glowing task to fly in and watch it get validated'), 2600);
  loop();
}
boot();
